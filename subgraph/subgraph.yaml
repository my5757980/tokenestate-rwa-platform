specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PropertyRegistry
    network: sepolia
    source:
      address: "0x0970bb32A1F21a94DF5Bb23f37f180f5EEd8f5E9"
      abi: PropertyRegistry
      startBlock: 11843049
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Property
        - Holding
      abis:
        - name: PropertyRegistry
          file: ../artifacts/contracts/PropertyRegistry.sol/PropertyRegistry.json
      eventHandlers:
        - event: PropertyListed(indexed uint256,indexed address,string,uint256,uint256)
          handler: handlePropertyListed
        - event: TokensPurchased(indexed uint256,indexed address,uint256,uint256)
          handler: handleTokensPurchased
        - event: PropertyPaused(indexed uint256)
          handler: handlePropertyPaused
        - event: PropertyUnpaused(indexed uint256)
          handler: handlePropertyUnpaused
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle
        - event: TransferBatch(indexed address,indexed address,indexed address,uint256[],uint256[])
          handler: handleTransferBatch
      file: ./src/property-registry.ts

  - kind: ethereum
    name: RentDistributor
    network: sepolia
    source:
      address: "0xfCC46865f53fb17f78ea885E43B07E2848298c97"
      abi: RentDistributor
      startBlock: 11843049
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - RentDistribution
        - RentClaim
      abis:
        - name: RentDistributor
          file: ../artifacts/contracts/RentDistributor.sol/RentDistributor.json
      eventHandlers:
        - event: RentDeposited(indexed uint256,indexed address,uint256)
          handler: handleRentDeposited
        - event: RentClaimed(indexed uint256,indexed address,uint256)
          handler: handleRentClaimed
      file: ./src/rent-distributor.ts

  - kind: ethereum
    name: Marketplace
    network: sepolia
    source:
      address: "0x33BB456DfA41FA4b1D9a3Cfc2CA66588E260d340"
      abi: Marketplace
      startBlock: 11843049
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Listing
      abis:
        - name: Marketplace
          file: ../artifacts/contracts/Marketplace.sol/Marketplace.json
      eventHandlers:
        - event: ListingCreated(indexed uint256,indexed address,indexed uint256,uint256,uint256)
          handler: handleListingCreated
        - event: ListingFulfilled(indexed uint256,indexed address,uint256)
          handler: handleListingFulfilled
        - event: ListingCancelled(indexed uint256,indexed address)
          handler: handleListingCancelled
      file: ./src/marketplace.ts

  - kind: ethereum
    name: KYCBadge
    network: sepolia
    source:
      address: "0x4149C0d1Dc520ce4b8EcE0ee212b64c9369F776C"
      abi: KYCBadge
      startBlock: 11843049
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - KYCBadge
      abis:
        - name: KYCBadge
          file: ../artifacts/contracts/KYCBadge.sol/KYCBadge.json
      eventHandlers:
        - event: BadgeIssued(indexed address,indexed uint256)
          handler: handleBadgeIssued
        - event: BadgeRevoked(indexed address,indexed uint256)
          handler: handleBadgeRevoked
      file: ./src/kyc-badge.ts
